<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TING-AI 語言</title>
    <style>
        /* 基本盒模型 & 平滑捲動 */
        * { box-sizing: border-box; }
        html, body { height: 100%; scroll-behavior: smooth; }

        /* 保留你原本的樣式（微調使右側面板運作） */
        body {
            background-image: url('{{ url_for('static', filename='2024-04-10_13-43-35_7375.png') }}');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: -15%;
            width: 15%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.3s ease;
            z-index: 1000;
        }
        .navbar.show { left: 0; }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 15px 0;
            padding: 10px 20px;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s;
        }
        .navbar a:hover { background-color: rgba(255,255,255,0.2); }

        .content {
            margin-left: 15%;
            padding: 20px;
            flex: 1;
            display: flex;
            justify-content: center;
            /* 垂直置中整個 ai-wrapper（讓 live 圖片區在畫面中間） */
            align-items: center;
            text-align: center;
            position: relative;
            min-height: calc(100vh - 40px);
        }
        .toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        .toggle-btn:hover { background-color: rgba(255,255,255,0.2); }

        /* 整個 AI 區容器：使用 grid 將圖片與輸入切分開來，右側回覆跨兩列 */
        .ai-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr; /* 左: 2 / 右:1 */
            grid-template-rows: 2fr 1fr;    /* 上: 圖片 2/3；下: 輸入 1/3 */
            gap: 16px;
            width: calc(100% - 40px);
            max-width: 1400px;
            /* 整個區塊高度佔畫面中間的 2/3（上下一致），並限制最大值 */
            height: min(95vh, 1000px);
            margin: 0 auto;
            align-items: stretch;
        }

        /* 圖片區（左上，僅放圖片） */
        .ai-live {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0,0,0,0.35);
            padding: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            min-width: 0;
            min-height: 0;
        }
        .ai-live-inner {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .ai-live img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
        }

        /* 右側：回覆區（跨兩列，保持原樣） */
        .ai-right {
            grid-column: 2 / 3;
            grid-row: 1 / 3; /* 跨上、下兩列，維持在右側整高度 */
            min-height: 320px;
            background: rgba(0,0,0,0.42);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            box-shadow: 0 6px 16px rgba(0,0,0,0.38);
        }
        .ai-right .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .ai-right .header .title { font-weight: bold; }
        .ai-right .header .toggle-memory {
            font-size: 0.9rem;
        }
        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            border-radius: 8px;
            background: rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }
        .msg.user { text-align: right; margin: 6px 0; }
        .msg.assistant { text-align: left; margin: 6px 0; }
        .msg .bubble {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 92%;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble { background: rgba(255,255,255,0.12); }
        .msg.assistant .bubble { background: rgba(255,255,255,0.06); }

        /* 獨立的輸入區（左下，完全與圖片分離） */
        .input-area {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0,0,0,0.35);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            min-height: 0;
        }

        /* textarea 與按鈕（與原先樣式一致） */
        textarea#userInput {
            width: 100%;
            height: 100%;
            resize: none;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: rgba(255,255,255,0.06);
            color: white;
            overflow: auto;
            min-height: 64px;
            direction: ltr;
            text-align: left;
            caret-color: white;
            word-break: break-word;
        }
        .ai-controls {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        button.btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
        }
        button.btn:active { transform: translateY(1px); }

        /* 記憶列表：超長內容可在 ai-messages 的捲軸內查看 */
        .memory-list { list-style: none; padding: 0; margin: 0; display: block; }
        .memory-list li { padding: 6px 8px; border-bottom: 1px dashed rgba(255,255,255,0.04); font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }

        /* 捲軸樣式：接近框架顏色（支援 WebKit 與 Firefox） */
        /* Firefox */
        textarea, .ai-messages, .memory-list {
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) rgba(0,0,0,0.18);
        }
        /* WebKit */
        textarea::-webkit-scrollbar,
        .ai-messages::-webkit-scrollbar,
        .memory-list::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        textarea::-webkit-scrollbar-track,
        .ai-messages::-webkit-scrollbar-track,
        .memory-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.18);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb,
        .ai-messages::-webkit-scrollbar-thumb,
        .memory-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        textarea::-webkit-scrollbar-thumb:hover,
        .ai-messages::-webkit-scrollbar-thumb:hover,
        .memory-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.09);
        }

        /* 微響應 */
        @media (max-width: 900px) {
            .ai-wrapper {
                display: grid;
                grid-template-columns: 1fr;
                /* 三個區塊等高：repeat(3, 1fr) */
                grid-template-rows: repeat(3, 1fr);
                gap: 12px;
                width: calc(100% - 24px);
                /* 手機上把整個 ai-wrapper 設成視窗高度減去頁首與按鈕高度，三格會平均分配 */
                height: calc(100vh - 96px); /* 若需調整留白，可改這個值 */
                margin: 12px auto;
                align-items: stretch;
            }

            /* 縮短側拉選單寬度為 88px，滑出時不會碰到主區塊 */
            .navbar {
                left: -88px;  /* 隱藏時往左偏移寬度值 */
                width: 88px;  /* 顯示時寬度為 88px（比之前 110px 短）*/
            }
            .navbar.show { left: 0; }

            /* 圖片區：讓它填滿第一列（等高） */
            .ai-live {
                grid-column: 1 / 2;
                grid-row: 1 / 2;
                padding: 8px;
                min-height: 0;
                height: 100%;
            }
            .ai-live-inner { height: 100%; }

            /* 回覆區變成第二列（等高） */
            .ai-right {
                grid-column: 1 / 2;
                grid-row: 2 / 3;
                padding: 8px;
                min-height: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .ai-right .header { margin-bottom: 8px; }
            .ai-messages { flex: 1; min-height: 0; overflow-y: auto; }

            /* 輸入區放在第三列（等高） */
            .input-area {
                grid-column: 1 / 2;
                grid-row: 3 / 4;
                background: transparent;
                padding: 0;
                gap: 8px;
                align-items: stretch;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            /* 內部：輸入框區塊（上），按鈕列（下） */
            .input-top {
                width: 100%;
                padding: 12px;
                background: rgba(0,0,0,0.35);
                border-radius: 12px;
                box-shadow: 0 6px 16px rgba(0,0,0,0.4);
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1 1 auto; /* 讓輸入框區塊填滿整個 input-area 的可用空間 */
                min-height: 0;
            }
            .input-top textarea#userInput {
                min-height: 0;
                height: 100%;
                resize: none;
                flex: 1 1 auto;
            }

            /* 底部按鈕列（固定高度，置於輸入區塊下方） */
            .bottom-bar {
                margin-top: 8px;
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: flex-start;
                padding: 8px 4px 8px 4px;
                flex: 0 0 auto;
            }
            /* 清除按鈕：手機版為大按鈕（flex:1） */
            #clearMemoryBtn {
                flex: 1 1 auto;
                height: 44px;
                border-radius: 10px;
                padding: 0 12px;
                font-size: 14px;
                background: #374151;
                color: white;
                border: none;
            }
            /* 發送按鈕：小按鈕固定寬 */
            #sendBtn {
                flex: 0 0 72px;
                height: 44px;
                border-radius: 10px;
                padding: 0 12px;
                font-size: 14px;
                background: #2563eb;
                color: white;
                border: none;
            }

            .content { padding: 12px; align-items: flex-start; }

            /* 非常小螢幕微調 */
            @media (max-width: 420px) {
                .ai-wrapper { height: calc(100vh - 80px); }
                #sendBtn { flex: 0 0 64px; }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <button class="toggle-btn" onclick="toggleMenu()">☰</button>

            <nav class="navbar" id="navbar">
                <a href="{{ url_for('music') }}">音樂</a>
                <a href="{{ url_for('game') }}">遊戲</a>
                <a href="{{ url_for('learning') }}">學習</a>
                <a href="{{ url_for('NLP') }}">語言</a>
                <a href="{{ url_for('index') }}">主頁</a>
            </nav>

            <div style="width:100%; display:flex; justify-content:center;">
                <!-- ai-wrapper 使用 grid：上圖 (ai-live)、右回覆 (ai-right)、下方獨立輸入 (input-area) -->
                <div class="ai-wrapper" id="aiWrapper">

                    <!-- 圖片區（只放圖片） -->
                    <div class="ai-live" id="aiLive">
                        <div class="ai-live-inner">
                            <img src="{{ url_for('static', filename='images/00001-1565672939-2.png') }}" alt="AI Live Placeholder" id="aiLiveImg">
                        </div>
                    </div>

                    <!-- 右側回答區（跨上下兩列） -->
                    <div class="ai-right">
                        <div class="header">
                            <div class="title">AI 回答</div>
                            <div>
                                <button class="btn toggle-memory" id="toggleMemoryBtn">顯示：回覆</button>
                            </div>
                        </div>
                        <div class="ai-messages" id="aiMessages" aria-live="polite" aria-atomic="false">
                            <!-- 這裡會 render 回覆或記憶（內部捲軸） -->
                        </div>
                    </div>

                    <!-- 完全獨立的輸入區（不在 ai-live 內部） -->
                    <div class="input-area">
                        <textarea id="userInput" placeholder="在這裡輸入你的問題，按 Enter 發送（Shift+Enter 換行）"></textarea>
                        <div class="ai-controls">
                            <button class="btn" id="clearMemoryBtn">清除本機記憶</button>
                            <button class="btn" id="sendBtn">發送</button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

<script>
/*
 改進的前端短暫記憶（localStorage）實作（保留先前邏輯）
  - 記憶排序：過去提問（memory）由舊到新（上到下）
  - 每次 render 後捲到底（讓最新在最下面）
  - textarea / 回覆區 / 記憶區皆在內部捲動
*/

const STORAGE_KEY = 'ting_ai_conversation';
const recentLimit = 40;
const STORAGE_WARNING_BYTES = 2.4 * 1024 * 1024;
const SYSTEM_PROMPT = (
    "你是個助理。當使用者使用中文或包含中文漢字時，請以 繁體中文（臺灣常用表達） 回答；"
    + "若使用者使用英文或其他語言，請以使用者使用的語言回答。"
    + "請保持回答清楚、友善並避免使用簡體字。"
);

let viewMode = 'replies'; // 'replies' 或 'memory'

function approximateBytes(str) {
    try {
        return new Blob([str]).size;
    } catch (e) {
        return str.length * 2;
    }
}

function loadMemory() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed;
    } catch (e) {
        console.error('parse storage fail', e);
        return [];
    }
}

function isQuotaExceeded(e) {
    if (!e) return false;
    return (
        e instanceof DOMException &&
        (e.code === 22 || e.code === 1014 || e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED')
    ) || (e && e.message && e.message.toLowerCase().includes('quota'));
}

function saveMemory(arr) {
    let toSave = arr.slice(-recentLimit);
    let json = JSON.stringify(toSave);
    try {
        localStorage.setItem(STORAGE_KEY, json);
        const used = approximateBytes(json);
        if (used >= STORAGE_WARNING_BYTES) {
            if (confirm('本機儲存空間已接近上限，建議清除過去對話以避免發生錯誤。是否現在清除最舊 10 筆以釋放空間？')) {
                toSave = toSave.slice(10);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                    alert('已清除最舊 10 筆。');
                } catch (e) {
                    console.warn('再次寫入失敗', e);
                }
            }
        }
        return true;
    } catch (e) {
        console.warn('initial save failed:', e);
        if (isQuotaExceeded(e)) {
            let fallback = toSave.slice();
            while (fallback.length > 0) {
                fallback.shift();
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(fallback));
                    alert('本機儲存空間不足，已自動刪除最舊的對話以保留最新內容。如需更多空間請手動清除對話紀錄。');
                    return true;
                } catch (err2) {
                    if (!isQuotaExceeded(err2)) {
                        console.error('saveMemory failed (non-quota):', err2);
                        break;
                    }
                }
            }
            alert('本機儲存空間不足，無法儲存對話。請手動清除對話紀錄（按「清除本機記憶」），或在瀏覽器設定中調整網站儲存空間。');
            return false;
        } else {
            console.error('saveMemory failed (unknown):', e);
            return false;
        }
    }
}

function addMessage(role, content) {
    const arr = loadMemory();
    arr.push({role, content, ts: Date.now()});
    const ok = saveMemory(arr);
    if (!ok) {
        console.warn('message not saved to localStorage');
    }
}

// renderMessages：調整 memory 模式排序（由舊到新）並在最後捲到底
function renderMessages() {
    const container = document.getElementById('aiMessages');
    container.innerHTML = '';
    const data = loadMemory();

    if (viewMode === 'memory') {
        const ul = document.createElement('ul');
        ul.className = 'memory-list';
        // 由舊到新（上到下）
        const userMsgs = data.filter(m => m.role === 'user');
        if (userMsgs.length === 0) {
            ul.innerHTML = '<li>暫無本機提問記錄</li>';
        } else {
            userMsgs.forEach(m => {
                const li = document.createElement('li');
                const d = new Date(m.ts);
                li.textContent = `${d.toLocaleString()} — ${m.content}`;
                ul.appendChild(li);
            });
        }
        container.appendChild(ul);
        // 確保顯示最新（在最下面）
        container.scrollTop = container.scrollHeight;
    } else {
        const slice = data.slice(-recentLimit);
        slice.forEach(m => {
            const div = document.createElement('div');
            div.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = m.content;
            div.appendChild(bubble);
            container.appendChild(div);
        });
        if (slice.length === 0) {
            container.innerHTML = '<div style="opacity:0.8">目前沒有對話，請在左下方輸入你的問題並按發送。</div>';
        }
        // 捲到底（讓最新回覆與最新提問出現在最下方）
        container.scrollTop = container.scrollHeight;
    }
}

function buildOutgoingMessages(additionalUserMessage) {
    const mem = loadMemory();
    let msgs = mem.map(m => ({role: m.role, content: m.content}));
    if (additionalUserMessage) msgs.push({role: 'user', content: additionalUserMessage});
    const hasSystem = msgs.some(m => m.role === 'system');
    if (!hasSystem) {
        msgs = [{role: 'system', content: SYSTEM_PROMPT}].concat(msgs);
    }
    const systemPart = msgs.filter(m => m.role === 'system');
    const other = msgs.filter(m => m.role !== 'system').slice(-12);
    return systemPart.concat(other);
}

async function sendToServerAndRender(userText) {
    const container = document.getElementById('aiMessages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'msg assistant';
    typingDiv.innerHTML = '<div class="bubble">AI 回覆中…</div>';
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;

    const outgoing = buildOutgoingMessages(userText);

    addMessage('user', userText);

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: outgoing })
        });
        const j = await resp.json();
        let reply = '';
        if (j && j.ok) reply = j.reply || '（空回覆）';
        else reply = j.reply || ('伺服器錯誤：' + (j.error || '未知錯誤'));

        addMessage('assistant', reply);
        renderMessages();
    } catch (e) {
        console.error(e);
        const errMsg = '發送失敗（請檢查伺服器 / 網路）。';
        addMessage('assistant', errMsg);
        renderMessages();
    }
}

// 綁定事件（保留原本的監聽）
// send button
document.getElementById('sendBtn').addEventListener('click', () => {
    const ta = document.getElementById('userInput');
    const text = ta.value.trim();
    if (!text) return;
    ta.value = '';
    sendToServerAndRender(text);
});

// Enter 發送（Shift+Enter 換行）
document.getElementById('userInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('sendBtn').click();
    }
});

// 切換記憶 / 回覆檢視
document.getElementById('toggleMemoryBtn').addEventListener('click', () => {
    viewMode = (viewMode === 'replies') ? 'memory' : 'replies';
    document.getElementById('toggleMemoryBtn').textContent = '顯示：' + (viewMode === 'replies' ? '回覆' : '過去提問');
    renderMessages();
});

// 清除本機記憶
document.getElementById('clearMemoryBtn').addEventListener('click', () => {
    if (confirm('確定要清除本機記憶（localStorage）嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        renderMessages();
        alert('本機記憶已清除。');
    }
});

function toggleMenu() {
    var navbar = document.getElementById('navbar');
    navbar.classList.toggle('show');
}

// init
renderMessages();
</script>
</body>
</html>
