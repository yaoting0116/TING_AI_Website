services:
  - type: web
    name: TING_AI_Website
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      # HF_API_KEY 設為 secret（不要把實際 key 寫在 repo）
      - key: HF_API_KEY
        sync: false

